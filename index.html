<html lang="en">
<head>
<meta charset="utf-8">
<title>Iron Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">

<style>
/* Layout: one-column phone app — scrolling view, fixed tab bar, bottom sheets. Dark gym look; muscle colours borrowed from bumper-plate coding. */
:root{
  color-scheme:dark;
  --bg:#0f1114; --surface:#171a1f; --surface2:#20242b; --line:#2b3039;
  --fg:#eef1f5; --muted:#8c94a3; --faint:#5c6472;
  --accent:#2f7cf6; --accent-fg:#ffffff; --accent-soft:rgba(47,124,246,.16);
  --ok:#22a06b; --ok-soft:rgba(34,160,107,.16);
  --pr:#f5b301; --pr-soft:rgba(245,179,1,.14);
  --danger:#e5484d; --danger-soft:rgba(229,72,77,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --tabh:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

#app{padding-top:calc(var(--sat) + 10px);padding-bottom:calc(var(--tabh) + var(--sab) + 90px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:640px;margin:0 auto}
h1{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.01em;margin:6px 0 14px}
h2{font-family:var(--display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
h3{font-size:17px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;
  background:var(--surface2);font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.block{width:100%}
.btn.big{min-height:56px;font-size:17px;border-radius:14px}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:9px}
.btn:active{filter:brightness(1.2)}
.icon-btn{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:active{background:var(--surface2)}

.card{background:var(--surface);border-radius:16px;padding:14px}
.list{background:var(--surface);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li:active{background:var(--surface2)}
.chev{color:var(--faint)}

.mtag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.mtag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mc,var(--muted))}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.pill.pr{background:var(--pr-soft);color:var(--pr)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* banner */
.banner{display:flex;gap:12px;align-items:center;background:var(--pr-soft);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.banner p{flex:1;font-size:14px}

/* routines */
.routine{display:flex;flex-direction:column;gap:8px}
.routine .names{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* active workout */
.wk-head{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.wk-name{flex:1;min-width:0;background:transparent;border:0;font-family:var(--display);font-size:26px;font-weight:800;padding:4px 0;color:var(--fg)}
.wk-meta{display:flex;gap:14px;color:var(--muted);font-size:14px;margin:-8px 0 14px}
.exc{background:var(--surface);border-radius:16px;padding:12px 10px 8px;margin-bottom:12px}
.exc-h{display:flex;align-items:center;gap:8px;padding:0 4px 8px}
.exc-h .exname{font-weight:700;font-size:17px;color:var(--accent);text-align:left;flex:1;min-width:0}
.exc-note{font-size:14px;color:var(--muted);padding:0 4px 8px;white-space:pre-wrap}
.srow{display:grid;grid-template-columns:34px minmax(0,1fr) 72px 60px 44px;gap:6px;align-items:center;padding:3px 2px;border-radius:10px}
.srow.head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding-bottom:2px}
.srow.head span{text-align:center}
.srow.head span:nth-child(2){text-align:left;padding-left:4px}
.srow.done{background:var(--ok-soft)}
.sn{height:34px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted);background:var(--surface2)}
.sn.wu{color:var(--pr)}
.prev{text-align:left;font-size:13px;color:var(--faint);padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:34px}
.srow input{width:100%;height:36px;border-radius:8px;border:0;background:var(--surface2);text-align:center;font-weight:700;padding:0 4px}
.srow input::placeholder{color:var(--faint);font-weight:600}
.srow.done input{background:transparent}
.chk{height:36px;border-radius:8px;background:var(--surface2);color:var(--faint);display:flex;align-items:center;justify-content:center}
.srow.done .chk{background:var(--ok);color:#fff}
.addset{width:100%;margin-top:6px;min-height:38px;border-radius:10px;background:var(--surface2);font-size:14px;font-weight:600;color:var(--muted)}
.prtag{color:var(--pr);font-size:11px;font-weight:800;margin-left:4px}

/* rest timer + workout pill */
#dock{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--sab));z-index:30;
  padding:0 max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px));pointer-events:none}
#dock>*{pointer-events:auto;max-width:616px;margin:0 auto}
.rest{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.rest .t{font-family:var(--display);font-size:24px;font-weight:800;flex:1}
.rest.over{border-color:var(--ok)}
.rest.over .t{color:var(--ok)}
.wkpill{display:flex;align-items:center;gap:10px;width:100%;background:var(--accent);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.wkpill .grow{text-align:left}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(18,20,24,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;padding:0 max(0px,env(safe-area-inset-left,0px)) var(--sab) max(0px,env(safe-area-inset-right,0px))}
.tab{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:640px;max-height:calc(100% - var(--sat) - 24px);background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1);
  padding-bottom:var(--sab)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;border-bottom:1px solid var(--line)}
.sheet-h .ttl{flex:1;text-align:center;font-weight:700;font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-h .btn{min-height:38px;padding:0 10px}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px max(16px,env(safe-area-inset-left,0px)) 20px max(16px,env(safe-area-inset-right,0px));flex:1}
.sheet.small .sheet-b{padding-top:20px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.inp{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
textarea.inp{padding:10px 12px;min-height:90px;resize:vertical}
.search{position:relative}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--surface2);transition:.2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(20px)}

/* picker */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--mc)}
.mcard b{font-size:16px}
.mcard span{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;background:var(--surface);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);color:#fff}
.pk-item .box{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.pk-item.sel .box{background:var(--accent);border-color:var(--accent);color:#fff}
.pk-item .nm{font-weight:600}

/* history */
.wcard{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px}
.wcard .stats{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.wcard .exl{font-size:14px;color:var(--muted);line-height:1.5}
.dset{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:4px 0;font-size:15px}
.dset .k{color:var(--faint);font-weight:700}

/* progress */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:14px}
.tile .v{font-family:var(--display);font-size:28px;font-weight:800}
.tile .l{font-size:13px;color:var(--muted)}
.mbar{display:grid;grid-template-columns:92px 1fr 30px;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.mbar .track{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.mbar .fill{height:100%;border-radius:99px;background:var(--mc)}
.seg{display:flex;background:var(--surface);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--fg)}
.chartbox{background:var(--surface);border-radius:16px;padding:12px 8px 6px;margin:10px 0}
.chartbox canvas{width:100%;height:210px;display:block}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* plates */
.plates{display:flex;align-items:center;justify-content:center;gap:3px;height:120px;margin:16px 0}
.plates .sleeve{width:40px;height:12px;background:#9aa3b0;border-radius:2px}
.plates .collar{width:10px;height:26px;background:#c4cad3;border-radius:2px}
.plate{border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;writing-mode:vertical-rl}

.toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);transform:translateX(-50%);z-index:90;background:var(--surface2);border:1px solid var(--line);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:calc(100% - 32px);animation:fade .2s}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:6px}
</style>
</head>

const fclock=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');};

/* history lookups */
function sortedWorkouts(){return db.workouts.slice().sort((a,b)=>b.start-a.start);}
function lastSetsFor(exId,excludeId){
  let best=null;
  for(const w of db.workouts){if(w.id===excludeId)continue;if(best&&w.start<=best.start)continue;const e=w.exercises.find(x=>x.exId===exId);if(e)best={start:w.start,sets:e.sets};}
  return best?best.sets:null;
}
function sessionsFor(exId){
  const out=[];
  for(const w of db.workouts){for(const e of w.exercises){if(e.exId!==exId)continue;const ws=working(e.sets);if(!ws.length)continue;
    let e1=0,maxW=0,vol=0,best=null,reps=0;
    for(const s of ws){const x=e1rm(s.w,s.r);if(x>e1){e1=x;best=s;}if((s.w||0)>maxW)maxW=s.w||0;vol+=(s.w||0)*(s.r||0);reps+=s.r||0;}
    out.push({t:w.start,wid:w.id,sets:e.sets,e1,maxW,vol,best,reps});}}
  return out.sort((a,b)=>a.t-b.t);
}
function computePRs(w){
  const prs=[];
  for(const e of w.exercises){
    let pW=0,pE=0,pR=0,had=false;
    for(const o of db.workouts){if(o.id===w.id||o.start>=w.start)continue;for(const oe of o.exercises){if(oe.exId!==e.exId)continue;for(const s of working(oe.sets)){had=true;pW=Math.max(pW,s.w||0);pE=Math.max(pE,e1rm(s.w,s.r));if(!s.w)pR=Math.max(pR,s.r||0);}}}
    e.sets.forEach(s=>delete s.pr);
    if(!had)continue;
    let bW=null,bE=null,bR=null;
    for(const s of working(e.sets)){
      if((s.w||0)>pW&&(!bW||s.w>bW.w))bW=s;
      const x=e1rm(s.w,s.r);if(x>pE&&(!bE||x>e1rm(bE.w,bE.r)))bE=s;
      if(!s.w&&!pW&&(s.r||0)>pR&&(!bR||s.r>bR.r))bR=s;
    }
    if(bW){bW.pr=1;prs.push({name:e.name,type:'Heaviest weight',val:`${fw(bW.w)} kg × ${bW.r}`});}
    if(bE&&bE!==bW){bE.pr=1;prs.push({name:e.name,type:'Best est. 1RM',val:`${fw(r1(e1rm(bE.w,bE.r)))} kg (${fw(bE.w)} × ${bE.r})`});}
    if(bR){bR.pr=1;prs.push({name:e.name,type:'Most reps',val:`${bR.r} reps`});}
  }
  w.prs=prs;return prs;
}

function viewActive(a){

function exCard(e,i,a){
  const ex=getEx(e.exId,e);
  const prev=lastSetsFor(e.exId,a.editingId)||[];
  const prevWork=working(prev);
  let h=`<section class="exc"><div class="exc-h"><button class="exname" data-act="exDetail" data-ex="${esc(e.exId)}">${esc(ex.name)}</button>${mtag(ex.m)}<button class="icon-btn" data-act="exMenu" data-i="${i}" aria-label="Exercise options">${ICON.dots}</button></div>`;
  if(e.note)h+=`<div class="exc-note">${esc(e.note)}</div>`;
  h+=`<div class="srow head"><span>Set</span><span>Previous</span><span>kg</span><span>Reps</span><span>✓</span></div>`;
  let n=0,wn=0;
  e.sets.forEach((s,j)=>{
    let p;if(s.wu){p=prev.filter(x=>x.wu)[wn++];}else{p=prevWork[n];n++;}
    const before=e.sets[j-1];
    const phW=p?fw(p.w):(before&&before.w!=null?fw(before.w):'');
    const phR=p?p.r:(before&&before.r!=null?before.r:'');
    h+=`<div class="srow ${s.done?'done':''}"><button class="sn ${s.wu?'wu':''}" data-act="setMenu" data-i="${i}" data-j="${j}">${s.wu?'W':n}</button>
    <button class="prev num" data-act="usePrev" data-i="${i}" data-j="${j}" data-w="${p?fw(p.w):''}" data-r="${p?p.r:''}">${p?`${fw(p.w)||0} × ${p.r}`:'—'}</button>
    <input class="num" inputmode="decimal" enterkeyhint="next" data-field="w" data-i="${i}" data-j="${j}" value="${s.w!=null?fw(s.w):''}" placeholder="${esc(phW)}" aria-label="Weight in kg">
    <input class="num" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" data-field="r" data-i="${i}" data-j="${j}" value="${s.r!=null?s.r:''}" placeholder="${esc(phR)}" aria-label="Reps">
    <button class="chk" data-act="toggleSet" data-i="${i}" data-j="${j}" aria-label="Mark set done">${ICON.chk}</button></div>`;

/* ---- Progress ---- */
function viewProgress(){
  let h=`<h1>Progress</h1>`;
  if(!db.workouts.length)return h+`<div class="empty"><b>Nothing to chart yet</b>Log a few workouts and your strength curves, records and weekly volume show up here.</div>`;
  const now=Date.now(),ws0=weekStart(now);
  const thisWeek=db.workouts.filter(w=>w.start>=ws0);
  let vol=0;thisWeek.forEach(w=>vol+=wVolume(w).v);
  const weeks=new Set(db.workouts.map(w=>weekStart(w.start)));
  let streak=0,k=weeks.has(ws0)?ws0:ws0-7*DAY;
  while(weeks.has(k)){streak++;k=weekStart(k-3*DAY);}
  h+=`<div class="tiles"><div class="tile"><div class="v num">${db.workouts.length}</div><div class="l">Workouts logged</div></div><div class="tile"><div class="v num">${thisWeek.length}</div><div class="l">This week</div></div><div class="tile"><div class="v num">${streak}</div><div class="l">Week streak</div></div><div class="tile"><div class="v num">${fvol(vol)}</div><div class="l">Volume this week</div></div></div>`;
  const cnt={};db.workouts.filter(w=>w.start>=now-7*DAY).forEach(w=>w.exercises.forEach(e=>{cnt[e.m]=(cnt[e.m]||0)+working(e.sets).length;}));
  const max=Math.max(1,...Object.values(cnt));
  h+=`<h2>Working sets · last 7 days</h2><div class="card">`;
  const hit=MUSCLES.filter(m=>cnt[m.id]);
  if(!hit.length)h+=`<p class="muted small">No sets in the last 7 days.</p>`;
  for(const m of hit)h+=`<div class="mbar" style="--mc:${m.c}"><span>${esc(m.name)}</span><div class="track"><div class="fill" style="width:${cnt[m.id]/max*100}%"></div></div><b class="num" style="text-align:right">${cnt[m.id]}</b></div>`;
  const missing=MUSCLES.filter(m=>!cnt[m.id]&&m.id!=='full').map(m=>m.name);
  if(hit.length&&missing.length)h+=`<p class="muted small" style="margin-top:8px">Not trained this week: ${esc(missing.join(', '))}</p>`;
  h+=`</div><h2>Exercises</h2><div class="search" style="margin-bottom:10px">${ICON.search}<input class="inp" id="progQ" data-field="progq" placeholder="Search your exercises" autocomplete="off"></div><div class="list" id="progList">${progList('')}</div>`;
  return h;
}
function progList(q){
  const map={};
  for(const w of db.workouts)for(const e of w.exercises){const ws=working(e.sets);if(!ws.length)continue;const o=map[e.exId]||(map[e.exId]={exId:e.exId,name:e.name,m:e.m,n:0,last:0,best:0});o.n++;o.last=Math.max(o.last,w.start);for(const s of ws)o.best=Math.max(o.best,e1rm(s.w,s.r));}
  let arr=Object.values(map).sort((a,b)=>b.last-a.last);

  if(!arr.length)return`<div class="li muted">No matching exercises</div>`;
  return arr.map(o=>`<button class="li" data-act="exDetail" data-ex="${esc(o.exId)}"><div class="grow"><div style="font-weight:600">${esc(getEx(o.exId,o).name)}</div><div class="small muted num">${mtag(o.m)} · ${o.n} session${o.n>1?'s':''} · last ${fdate(o.last,{day:'numeric',month:'short'})}</div></div><div class="num" style="text-align:right">${o.best?`<b>${fw(Math.round(o.best))}</b><div class="small muted">1RM kg</div>`:''}</div>${ICON.chev}</button>`).join('');

const chartState={metric:'e1',range:'all'};
function openExDetail(exId){

function renderExDetail(s){
  const ex=getEx(s.exId);const ses=sessionsFor(s.exId);
  let b=`<div class="row" style="gap:12px;margin-bottom:12px">${mtag(ex.m)}<span class="small muted">${esc(EQUIP[ex.eq]||'')}</span></div>`;
  if(!ses.length){s.body.innerHTML=b+`<div class="empty"><b>No sets logged yet</b>Add ${esc(ex.name)} to a workout and its records and chart show up here.</div>`;return;}
  let bestE=0,bestES=null,maxW=0,maxWS=null,bestVol=0;
  for(const x of ses){if(x.e1>bestE){bestE=x.e1;bestES=x.best;}if(x.maxW>maxW){maxW=x.maxW;}if(x.vol>bestVol)bestVol=x.vol;}
  for(const x of ses)for(const st of working(x.sets))if((st.w||0)===maxW&&(!maxWS||st.r>maxWS.r))maxWS=st;
  const bw=!maxW;
  const maxReps=Math.max(...ses.map(x=>Math.max(...working(x.sets).map(st=>st.r||0))));

  const metrics=bw?[['reps','Total reps'],['vol','Volume']]:[['e1','Est. 1RM'],['w','Heaviest'],['vol','Volume']];
  if(!metrics.some(m=>m[0]===chartState.metric))chartState.metric=metrics[0][0];
  b+=`<div class="seg" style="margin-top:14px">${metrics.map(([k,l])=>`<button class="${chartState.metric===k?'on':''}" data-act="chartMetric" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="chartbox"><canvas id="chart"></canvas></div>
  <div class="seg">${[['1m','1M'],['3m','3M'],['6m','6M'],['1y','1Y'],['all','All']].map(([k,l])=>`<button class="${chartState.range===k?'on':''}" data-act="chartRange" data-k="${k}">${l}</button>`).join('')}</div>
  <h2>History</h2><div class="list">`;
  for(const x of ses.slice().reverse()){b+=`<button class="li" data-act="openWkFromEx" data-id="${x.wid}"><div class="grow"><div class="small muted">${fdate(x.t,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</div><div class="num" style="font-size:15px">${working(x.sets).map(st=>`${fw(st.w)||0}×${st.r}${st.pr?'<span class="prtag">PR</span>':''}`).join(', ')}</div></div>${x.e1?`<span class="small muted num">${fw(Math.round(x.e1))}</span>`:''}</button>`;}
  b+=`</div>`;
  s.body.innerHTML=b;
  const days={'1m':31,'3m':92,'6m':183,'1y':366}[chartState.range];
  const from=days?Date.now()-days*DAY:0;
  const pts=ses.filter(x=>x.t>=from).map(x=>({t:x.t,v:{e1:r1(x.e1),w:x.maxW,vol:x.vol,reps:x.reps}[chartState.metric]}));
  requestAnimationFrame(()=>drawChart(s.body.querySelector('#chart'),pts,chartState.metric==='reps'?'':'kg'));
}
function niceStep(range){const raw=range/4;const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return(n<1.5?1:n<3?2:n<7?5:10)*p;}
function drawChart(cv,pts,unit){
  if(!cv)return;const dpr=window.devicePixelRatio||1;const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
  const c=cv.getContext('2d');c.scale(dpr,dpr);const cs=getComputedStyle(document.documentElement);
  const col=k=>cs.getPropertyValue(k).trim();
  c.font='12px -apple-system,system-ui,sans-serif';
  if(!pts.length){c.fillStyle=col('--muted');c.textAlign='center';c.fillText('No sessions in this range',W/2,H/2);return;}
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  if(hi===lo){hi+=Math.max(1,hi*.1);lo=Math.max(0,lo-Math.max(1,lo*.1));}
  const step=niceStep(hi-lo);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const L=44,R=14,Tp=12,B=24;const pw=W-L-R,ph=H-Tp-B;
  const t0=pts[0].t,t1=pts[pts.length-1].t;
  const X=t=>t1===t0?L+pw/2:L+(t-t0)/(t1-t0)*pw;const Y=v=>Tp+ph-(v-lo)/(hi-lo)*ph;
  c.strokeStyle=col('--line');c.fillStyle=col('--faint');c.lineWidth=1;c.textAlign='right';c.textBaseline='middle';
  for(let v=lo;v<=hi+1e-9;v+=step){const y=Math.round(Y(v))+.5;c.beginPath();c.moveTo(L,y);c.lineTo(W-R,y);c.stroke();c.fillText(v>=10000?r1(v/1000)+'k':fw(Math.round(v*10)/10),L-6,y);}
  c.textBaseline='top';c.textAlign='left';c.fillText(fdate(t0,{day:'numeric',month:'short'}),L,H-B+8);
  if(t1!==t0){c.textAlign='right';c.fillText(fdate(t1,{day:'numeric',month:'short'}),W-R,H-B+8);}
  const acc=col('--accent');
  if(pts.length>1){const g=c.createLinearGradient(0,Tp,0,Tp+ph);g.addColorStop(0,'rgba(47,124,246,.35)');g.addColorStop(1,'rgba(47,124,246,0)');
    c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(p.t),Y(p.v)):c.moveTo(X(p.t),Y(p.v)));c.lineTo(X(t1),Tp+ph);c.lineTo(X(t0),Tp+ph);c.closePath();c.fillStyle=g;c.fill();
    c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(p.t),Y(p.v)):c.moveTo(X(p.t),Y(p.v)));c.strokeStyle=acc;c.lineWidth=2.5;c.lineJoin='round';c.stroke();}
  pts.forEach((p,i)=>{const last=i===pts.length-1;c.beginPath();c.arc(X(p.t),Y(p.v),last?5:pts.length>40?0:3,0,7);c.fillStyle=last?acc:col('--surface');c.fill();c.strokeStyle=acc;c.lineWidth=2;c.stroke();});
  const lp=pts[pts.length-1];c.fillStyle=col('--fg');c.font='bold 13px -apple-system,system-ui,sans-serif';c.textBaseline='bottom';
  const lx=X(lp.t);c.textAlign=lx>W-60?'right':'center';c.fillText(fw(lp.v)+(unit?' '+unit:''),lx>W-60?lx+4:lx,Y(lp.v)-8);
}

  e.items.forEach((it,i)=>{const x=getEx(it.exId);h+=`<div class="li" style="gap:6px"><div class="grow"><div style="font-weight:600">${esc(x.name)}</div><div class="small">${mtag(x.m)}</div></div>
   <button class="btn sm" data-act="rtSets" data-i="${i}" data-d="-1" aria-label="Fewer sets">−</button><span class="num" style="width:44px;text-align:center;font-size:14px">${it.sets} sets</span><button class="btn sm" data-act="rtSets" data-i="${i}" data-d="1" aria-label="More sets">+</button>
   <button class="icon-btn" data-act="rtMove" data-i="${i}" aria-label="Move up">↑</button><button class="icon-btn" style="color:var(--danger)" data-act="rtDel" data-i="${i}" aria-label="Remove">✕</button></div>`;});
  h+=`</div><div class="stack" style="margin-top:12px"><button class="btn primary block" data-act="rtAdd">+ Add exercises</button>${e.id?`<button class="btn danger block" data-act="rtDelete">Delete routine</button>`:''}</div>`;
  e.sheet.body.innerHTML=h;
}

/* ---- Plate calculator ---- */
const PLATES=[[25,'#e5484d',110],[20,'#3b82f6',110],[15,'#f5b301',100],[10,'#22a06b',90],[5,'#e8ecf1',70],[2.5,'#5c6472',58],[1.25,'#9aa3b0',48]];
function openPlates(target){
  const s=openSheet({title:'Plate calculator',body:''});
  s.body.innerHTML=`<div class="row"><div class="field grow"><label for="plW">Target weight (kg)</label><input class="inp num" id="plW" data-field="platew" inputmode="decimal" value="${target||''}" placeholder="e.g. 100"></div><div class="field"><label for="plBar">Bar</label><select class="inp" id="plBar" data-field="platebar">${[20,15,10,7.5,0].map(b=>`<option ${db.settings.bar===b?'selected':''} value="${b}">${b} kg</option>`).join('')}</select></div></div><div id="plOut"></div>`;
  calcPlates();
}
function calcPlates(){
  const out=$('#plOut');if(!out)return;const w=num($('#plW').value),bar=num($('#plBar').value)||0;
  if(!w){out.innerHTML=`<p class="muted small" style="margin-top:16px">Enter a weight to see the plates for each side.</p>`;return;}
  let side=(w-bar)/2;if(side<0){out.innerHTML=`<p class="muted" style="margin-top:16px">Lighter than the bar.</p>`;return;}
  const used=[];for(const [p] of PLATES){while(side>=p-1e-9){used.push(p);side-=p;}}
  const plates=used.map(p=>{const d=PLATES.find(x=>x[0]===p);return`<div class="plate" style="background:${d[1]};height:${d[2]}px;width:${p>=10?18:12}px;color:${p===5?'#111':'#fff'}">${p}</div>`;}).join('');
  out.innerHTML=`<div class="plates"><div class="sleeve"></div><div class="collar"></div>${plates}</div>
  <p style="text-align:center;font-size:17px"><b>Each side:</b> <span class="num">${used.length?used.join(' + '):'nothing, just the bar'}</span></p>
  ${side>0.01?`<p class="small muted" style="text-align:center;margin-top:6px">${fw(r1(side*2))} kg can't be made with standard plates.</p>`:''}`;
}

/* ============ EXPORT / IMPORT ============ */
const today=()=>new Date().toISOString().slice(0,10);
function buildCSV(){
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=[['date','time','workout','exercise','muscle','equipment','set','warmup','weight_kg','reps','est_1rm_kg','volume_kg','pr','note']];
  for(const w of db.workouts.slice().sort((a,b)=>a.start-b.start)){const d=new Date(w.start);const ds=d.toISOString().slice(0,10),ts=d.toTimeString().slice(0,5);
    for(const e of w.exercises){let k=0;for(const s of e.sets){k++;rows.push([ds,ts,w.name,e.name,(MUS[e.m]||{}).name||e.m,EQUIP[getEx(e.exId,e).eq]||'',k,s.wu?'yes':'no',s.w||0,s.r,s.w?r1(e1rm(s.w,s.r)):'',(s.w||0)*(s.r||0),s.pr?'yes':'',e.note||'']);}}}
  return rows.map(r=>r.map(q).join(',')).join('\n');
}
function buildJSON(){const {active,...rest}=db;return JSON.stringify({app:'IronLog',exported:new Date().toISOString(),...rest,active},null,1);}
async function exportFile(kind){
  const json=kind==='json';const text=json?buildJSON():buildCSV();
  const name=`ironlog-${json?'backup':'sets'}-${today()}.${json?'json':'csv'}`;const type=json?'application/json':'text/csv';
  const framed=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
  const v=await choose(`${json?'Backup':'CSV export'} is ready (${(text.length/1024).toFixed(1)} KB).\n${framed?'Saving files is blocked in this preview. Copy the text instead.':'On iPhone, choose Save to Files to keep it in iCloud Drive.'}`,[...(framed?[]:[{label:'Save or share file',cls:'primary',value:'file'}]),{label:'Copy to clipboard',cls:framed?'primary':'',value:'copy'}]);
  if(!v)return;
  let ok=false;
  if(v==='file'){
    try{const f=new File([text],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});ok=true;}}catch(e){if(e&&e.name==='AbortError')return;}
    if(!ok){try{const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);ok=true;toast('Saved '+name);}catch(e){}}
  }else{
    try{await navigator.clipboard.writeText(text);ok=true;toast('Copied. Paste it into Notes or a file.');}catch(e){
      openSheet({title:'Copy this text',body:`<p class="small muted" style="margin-bottom:8px">Press and hold, then Select All and Copy.</p><textarea class="inp num" style="min-height:300px;font-size:12px" readonly>${esc(text)}</textarea>`});ok=true;}
  }
  if(ok&&json){db.lastBackup=Date.now();save();if(tab==='more'||tab==='workout')render();}
}
async function importText(text){
  let d;try{d=JSON.parse(text);}catch(e){toast('That file is not a valid backup.');return;}
  if(!d||!Array.isArray(d.workouts)){toast('No workouts found in that file.');return;}
  const v=await choose(`Backup from ${d.exported?fdate(d.exported,{day:'numeric',month:'short',year:'numeric'}):'unknown date'} with ${d.workouts.length} workouts.\n\nMerge adds anything missing. Replace wipes this phone's data first.`,[{label:'Merge into my data',cls:'primary',value:'merge'},{label:'Replace all my data',cls:'danger',value:'replace'}]);
  if(!v)return;
  if(v==='replace'){delete d.app;delete d.exported;db=normalize(d);}
  else{const ids=new Set(db.workouts.map(w=>w.id));d.workouts.forEach(w=>{if(!ids.has(w.id))db.workouts.push(w);});
    const tids=new Set(db.templates.map(t=>t.id));(d.templates||[]).forEach(t=>{if(!tids.has(t.id))db.templates.push(t);});
    const cids=new Set(db.custom.map(c=>c.id));(d.custom||[]).forEach(c=>{if(!cids.has(c.id))db.custom.push(c);});}
  indexCustom();save();render();toast(v==='merge'?'Backup merged':'Backup restored');
}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e);}});
document.addEventListener('input',e=>{const t=e.target;const f=t.dataset&&t.dataset.field;if(!f)return;
  if(f==='w'||f==='r'){const s=db.active.exercises[+t.dataset.i].sets[+t.dataset.j];const v=num(t.value);s[f]=v;saveSoon();}
  else if(f==='wkname'){db.active.name=t.value;saveSoon();}
  else if(f==='pkq'){picker.q=t.value.trim();renderPicker();}
  else if(f==='progq'){$('#progList').innerHTML=progList(t.value.trim());}
  else if(f==='rtname'){editing.name=t.value;}
  else if(f==='platew')calcPlates();
});
document.addEventListener('change',e=>{const t=e.target;const f=t.dataset&&t.dataset.field;
  if(f==='rest'){db.settings.rest=+t.value;save();}
  else if(f==='autoRest'){db.settings.autoRest=t.checked;save();}
  else if(f==='bar'){db.settings.bar=+t.value;save();}
  else if(f==='platebar'){calcPlates();}
});

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});
window.addEventListener('resize',()=>{const s=topSheet();if(s&&s.exId){const cv=s.body.querySelector('#chart');if(cv)renderExDetail(s);}});

render();
